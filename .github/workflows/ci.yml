name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcbeautify
        run: brew list xcbeautify || brew install xcbeautify

      # Signing is a local/App Store Connect concern; CI only needs to prove
      # the app compiles, so code signing is disabled for the simulator build.
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Momento.xcodeproj \
            -scheme Momento \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived-data \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
        shell: bash

  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install SwiftLint
        run: brew list swiftlint || brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  project-spec:
    name: XcodeGen spec is valid
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      # project.yml is the human-readable source of the Xcode project.
      # This validates it without overwriting the committed .xcodeproj.
      - name: Validate project.yml
        run: xcodegen dump --spec project.yml --type json > /dev/null
