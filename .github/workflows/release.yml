name: Release to App Store Connect

# Builds and uploads an App Store build using the release Xcode on GitHub's
# macOS runners. This exists because the local machine only has a beta Xcode,
# and App Store Connect rejects builds made with a beta SDK.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion to upload (must be higher than the last uploaded build)"
        required: true
        default: "3"

jobs:
  release:
    name: Archive, export and upload
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          # Fails the run early if the runner ever ships a beta Xcode, since
          # App Store Connect would reject the resulting build anyway.
          licence_type=$(/usr/libexec/PlistBuddy -c "Print :licenseType" \
            "$(xcode-select -p)/../Resources/LicenseInfo.plist" 2>/dev/null || echo "unknown")
          echo "Xcode license type: $licence_type"
          if [ "$licence_type" = "Beta" ]; then
            echo "::error::Runner has a beta Xcode; App Store uploads would be rejected."
            exit 1
          fi

          # iPhone Duo support in DuoLayout.swift is gated on compiler(>=6.4),
          # the Swift version Xcode 27 ships. An older toolchain still builds,
          # but silently ships a binary without Duo adaptation.
          swift_version=$(swift -version 2>&1 | grep -o 'Swift version [0-9.]*' | awk '{print $3}')
          echo "Swift version: $swift_version"
          if [ "$(printf '%s\n6.4\n' "$swift_version" | sort -V | head -1)" != "6.4" ]; then
            echo "::warning::Swift $swift_version predates 6.4 — this build will NOT include iPhone Duo support."
          fi

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/certificate.p12"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$cert_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$cert_path" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$keychain_path" > /dev/null
          security list-keychain -d user -s "$keychain_path"

          security find-identity -v -p codesigning "$keychain_path"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Set build number
        env:
          # Passed via env, never interpolated into the script body, so a
          # crafted input cannot break out into shell commands.
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::build_number must be a positive integer, got '$BUILD_NUMBER'"
              exit 1
              ;;
          esac
          /usr/bin/sed -i '' \
            "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" \
            Momento.xcodeproj/project.pbxproj
          grep -n "CURRENT_PROJECT_VERSION\|MARKETING_VERSION" Momento.xcodeproj/project.pbxproj

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Momento.xcodeproj \
            -scheme Momento \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Momento.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export App Store IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>4JP5T76ZNW</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Momento.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Verify the IPA is distribution-signed
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf verify && mkdir verify && cd verify
          unzip -q "$RUNNER_TEMP/export/Momento.ipa"
          codesign -dvvv Payload/Momento.app 2>&1 | grep "Authority=Apple Distribution" \
            || { echo "::error::IPA is not distribution-signed"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :DTXcodeBuild" Payload/Momento.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/Momento.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/Momento.app/Info.plist

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Momento.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Momento-ipa
          path: ${{ runner.temp }}/export/Momento.ipa
          if-no-files-found: warn
